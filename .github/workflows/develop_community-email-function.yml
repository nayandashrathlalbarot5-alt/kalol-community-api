# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core app to Azure Function App - community-email-function

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'KalolCommunity.Api/KalolCommunity.Communication.Functions'
  DOTNET_VERSION: '8.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: pwsh
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build KalolCommunity.Api/KalolCommunity.Communication.Functions/KalolCommunity.Communication.Functions.csproj --configuration Release
          popd

      - name: Publish
        run: dotnet publish KalolCommunity.Api/KalolCommunity.Communication.Functions/KalolCommunity.Communication.Functions.csproj -c Release -o ./output
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_71BDA8B8C5A749DEB64B133603D248A9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3F2166FE03D040FCB337B855EACA1BD8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_03376EA5EF914D0488FA81679559C64C }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'community-email-function'
          slot-name: 'Production'
          package: './output'
          
