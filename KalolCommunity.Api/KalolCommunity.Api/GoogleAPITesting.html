<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Google Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        #token-display {
            margin-top: 20px;
            padding: 20px;
            background: #f0f0f0;
            word-wrap: break-word;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Test Google Authentication</h1>
    <p>Click the button below to sign in with ANY Google account</p>

    <div id="g_id_onload"
         data-client_id="511863021562-4jlv3684r8fqeojdhavoilm66aatb2i9.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-ux_mode="popup"
         data-itp_support="true">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <div id="token-display">
        <h3>✅ ID Token Generated:</h3>
        <p><strong>Logged in as:</strong> <span id="user-email"></span></p>
        <textarea id="token-value" rows="10" style="width: 100%; font-family: monospace;"></textarea>
        <br><br>
        <button onclick="copyToken()">📋 Copy Token</button>
        <button onclick="testAPI()">🚀 Test API</button>
        <div id="api-result"></div>
    </div>

    <script>
    let currentToken = '';

        function handleCredentialResponse(response) {
            currentToken = response.credential;

            // Decode JWT to show user info (just for display, not for validation)
            const payload = JSON.parse(atob(response.credential.split('.')[1]));

            document.getElementById('user-email').textContent = payload.email;
            document.getElementById('token-value').value = response.credential;
            document.getElementById('token-display').style.display = 'block';

            console.log("ID Token:", response.credential);
            console.log("User Email:", payload.email);
        }

        function copyToken() {
            const tokenField = document.getElementById('token-value');
            tokenField.select();
            document.execCommand('copy');
            alert('Token copied to clipboard!');
        }

        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '<p>Testing API...</p>';

            try {
                const response = await fetch('https://localhost:7260/api/auth/google-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        idToken: currentToken
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                            <div class="success">
                                <h4>✅ API Test Successful!</h4>
                                <p><strong>Message:</strong> ${data.message}</p>
                                <p><strong>User ID:</strong> ${data.data.userId}</p>
                                <p><strong>JWT Token:</strong> ${data.data.token.substring(0, 50)}...</p>
                            </div>
                        `;
                } else {
                    resultDiv.innerHTML = `
                            <div style="background: #f8d7da; color: #721c24; padding: 15px;">
                                <h4>❌ API Test Failed</h4>
                                <p><strong>Status:</strong> ${response.status}</p>
                                <p><strong>Message:</strong> ${data.message || 'Unknown error'}</p>
                            </div>
                        `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                        <div style="background: #f8d7da; color: #721c24; padding: 15px;">
                            <h4>❌ Network Error</h4>
                            <p>${error.message}</p>
                            <p>Make sure your API is running at https://localhost:7260</p>
                        </div>
                    `;
            }
        }</script>
</body>
</html>
